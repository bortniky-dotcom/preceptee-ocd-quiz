name: Deploy Pages
# ocdquiz hanging-shield + readability inject 2026-09-28
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire quiz.css header and official crest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          t = p.read_text()
          t = t.replace('<title>Preceptorship Exam</title>', '<title>OCD preceptorship exam</title>')
          t = re.sub(r'<style>.*?</style>', '<link rel="stylesheet" href="quiz.css">', t, count=1, flags=re.S)
          old = '''<header>\n  <div class="brand"><img src="yb-crest.svg" width="72" height="82" alt="YB"></div>\n  <p>Preceptorship exam. 25 items. Answers after you submit.</p>\n</header>'''
          new = '''<header>\n  <div class="brand">\n    <img src="" width="50" height="56" alt="YB crest">\n    <p>Preceptorship exam. 25 items. Answers after you submit.</p>\n  </div>\n</header>'''
          t = t.replace(old, new)
          if 'yb-crest.js' not in t:
              t = t.replace('</body>', '<script src="yb-crest.js"></script>\n</body>', 1)
          p.write_text(t)
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
